[tool.poetry]
name = "traffic-accident-analyser"
version = "0.1.0"
description = "FastAPI backend for traffic accident prediction and analysis"
packages = [{include = "app"}]

[tool.poetry.dependencies]
python = ">=3.12,<4.0"
fastapi = "0.109.0"
uvicorn = {extras = ["standard"], version = "0.27.0"}
pydantic = "^2.5"
pydantic-core = "2.27.1"
pydantic-settings = "2.1.0"
motor = "^3.6"
pymongo = "^4.9"
python-dotenv = "1.0.0"
python-multipart = "0.0.6"
httpx = "0.25.2"
fastapi-mail = "1.4.1"
email-validator = "2.3.0"
pwdlib = {extras = ["argon2"], version = "0.3.0"}
pyjwt = "2.8.0"
scikit-learn = "1.6.1"
pandas = "2.2.0"
numpy = "1.26.3"

[tool.poetry.group.dev.dependencies]
pytest = "7.4.4"
pytest-asyncio = "0.23.2"
black = "23.12.1"
ruff = "0.1.14"
mypy = "1.8.0"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.black]
line-length = 100
target-version = ["py311"]

[tool.ruff]
line-length = 100
target-version = "py311"
select = ["E", "F", "W", "I"]

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false